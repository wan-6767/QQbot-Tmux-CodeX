[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-tmux-relay"
version = "0.2.1"
description = "Owner-only QQ bot relay for existing tmux terminals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Wan-zone"}]
dependencies = []

[project.urls]
Repository = "https://github.com/Wan-zone/QQbot-Tmux"
Issues = "https://github.com/Wan-zone/QQbot-Tmux/issues"

[project.scripts]
qq-tmux-bridge = "tmux_bot.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]
