name: Guide Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/guide/package-lock.json
      - run: npm ci
        working-directory: docs/guide
      - run: npx playwright install --with-deps chromium
        working-directory: docs/guide
      - run: npm test
        working-directory: docs/guide
      - run: npm run build
        working-directory: docs/guide
      - uses: actions/upload-artifact@v4
        with:
          name: offline-guide
          path: dist/guide
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: docs/guide/test-results
